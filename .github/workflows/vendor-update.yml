name: Check for library updates

# The libraries in /vendor/ are served from this site, which means nothing
# updates them but us. This looks once a month, and when something newer
# exists it opens a PULL REQUEST — the live site does not change until that
# pull request is merged, which is the whole point of self-hosting them.
#
# It also writes vendor/status.json straight to main on every run, so the
# admin panel can show when the last check happened without anyone opening
# GitHub.

on:
  schedule:
    # 09:37 UTC on the 1st. Deliberately not on the hour: scheduled jobs
    # pile up at :00 and get delayed.
    - cron: '37 9 1 * *'
  workflow_dispatch:        # the "Run workflow" button, for checking on demand

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: vendor-update
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Look for newer versions, and take them if the file checks out
        id: run
        run: node scripts/update-vendor.mjs

      - name: Identify the commits as the robot, not as a person
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # status.json is just a note of what was found. It carries no risk, so
      # it goes straight to main and the admin panel picks it up.
      - name: Record the result for the admin panel
        run: |
          if ! git diff --quiet -- vendor/status.json; then
            git add vendor/status.json
            git commit -m "Record the monthly library check"
            git push origin HEAD:main
            echo "Status recorded."
          else
            echo "Nothing changed in the status file."
          fi

      - name: Is there an actual library change to propose?
        id: changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
            git status --porcelain
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "Everything is already up to date."
          fi

      - name: Open (or refresh) the pull request
        if: steps.changed.outputs.yes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH=vendor-updates
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "Update the self-hosted libraries in /vendor/

          Versions picked by scripts/update-vendor.mjs from npm, inside the
          major version pinned in vendor/vendor.json. Each file was checked
          for size, that it parses as JavaScript, and that it mentions the
          symbol the site uses, before being accepted.

          Nothing on the live site changes until this is merged."
          git push --force origin "$BRANCH"

          # A stable branch means a re-run updates the open PR instead of
          # stacking up a new one every month.
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "The existing pull request has been updated."
          else
            gh pr create \
              --base main --head "$BRANCH" \
              --title "Library updates for /vendor/" \
              --body "$(cat <<'BODY'
The monthly check found newer versions of one or more libraries in `/vendor/`.

**Nothing on the live site has changed.** These files are served from the site
itself, so the versions visitors load are whatever is on `main`. Merging this
is what puts them live.

Each file here was downloaded from the official npm package, inside the major
version pinned in `vendor/vendor.json`, and had to pass three checks before it
was accepted: a sensible size, it parses as JavaScript, and it mentions the
symbol the site actually calls.

What that does **not** prove is that the library still behaves the same way.
Staying inside a major version makes a break unlikely, but if you want to be
sure before merging, open a booking page and the admin panel from this branch
and check they load.

See `vendor/README.md` for what each library does and why they live here.
BODY
)"
          fi
