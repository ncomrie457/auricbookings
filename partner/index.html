<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partner With Us — Corporate &amp; Private Pilates | Auric Movement</title>
  <meta name="description" content="Auric Movement hosts Pilates and wellness sessions for companies, teams and private groups across NYC and Long Island. Tell us about your group and what you're imagining.">

  <!-- Open Graph — the link that goes to a company, so the preview has to read
       as a business one. The group shot, not a flyer: a dated event flyer makes
       a year-round service look like a one-off party. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Auric Movement">
  <meta property="og:url" content="https://book.auricmovement.com/partner">
  <meta property="og:title" content="Partner With Us ✦ Auric Movement">
  <meta property="og:description" content="Pilates and wellness sessions for companies, teams and private groups — NYC and Long Island. Tell us about your group and we'll build the session around it.">
  <meta property="og:image" content="https://book.auricmovement.com/og-preview.jpg?v=2">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A room full of people after an Auric Movement class in New York.">

  <!-- Twitter / iMessage card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Partner With Us ✦ Auric Movement">
  <meta name="twitter:description" content="Pilates and wellness sessions for companies, teams and private groups — NYC and Long Island.">
  <meta name="twitter:image" content="https://book.auricmovement.com/og-preview.jpg?v=2">

  <link rel="canonical" href="https://book.auricmovement.com/?event=corporate">

  <!-- Redirect humans to the Partner With Us tab. Social crawlers only read the
       meta tags above.

       Why this page exists: the tab is reached in-page by ?event=corporate,
       which is not a link anyone would type or put in a proposal, and the
       #tab-corporate anchor does not survive a page load — it lands on the
       home page. /partner is the one address that can go in an email to a
       company. -->
  <meta http-equiv="refresh" content="0;url=/?event=corporate">
  <script>window.location.replace('/?event=corporate');</script>

  <style>
    body {
      font-family: 'Cormorant Garamond', Georgia, serif;
      background: #f4ece0;
      color: #5A3A1A;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-style: italic;
      text-align: center;
      padding: 2rem;
    }
    a { color: #b23a2e; text-decoration: none; }
  </style>
</head>
<body>
  <p>Taking you to <a href="/?event=corporate">Partner With Us</a>&hellip;</p>
</body>
</html>
