<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Auric Movement — Business Expenses</title>
<style>
  :root{--ivory:#f1e9da;--cream:#faf6ee;--card:#fffdf9;--brown:#5A3A1A;--gold:#9c6b34;--gold-soft:#c79a5e;--muted:#8a7d6b;--border:#e6dbc8;--sage:#8a9a78;--red:#b0432e;--green:#4b7a4b;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Jost','Helvetica Neue',Arial,sans-serif;background:var(--ivory);color:#3d322a;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1080px;margin:0 auto;padding:1.6rem 1.1rem 4rem;}
  header{text-align:center;margin:.6rem 0 1.4rem;}
  .eyebrow{font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:600;}
  h1{font-family:Georgia,'Cormorant Garamond',serif;font-size:1.9rem;color:var(--brown);margin-top:.35rem;font-weight:600;}
  h1 em{color:var(--sage);font-style:italic;}
  /* Stat cards */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem;margin:1.2rem 0;}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:.9rem 1rem;text-align:center;box-shadow:0 12px 30px -26px rgba(90,58,26,.4);}
  .stat .label{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700;}
  .stat .value{font-family:Georgia,serif;font-size:1.35rem;color:var(--brown);margin-top:.25rem;font-weight:600;}
  @media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr);}}
  /* Card / form */
  .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.2rem 1.2rem 1.35rem;margin-bottom:1.3rem;box-shadow:0 14px 34px -30px rgba(90,58,26,.35);}
  .panel h2{font-family:Georgia,serif;font-size:1.15rem;color:var(--brown);margin-bottom:.9rem;font-weight:600;}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem;}
  @media(max-width:640px){.grid{grid-template-columns:1fr;}}
  label{display:block;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:.28rem;}
  input,select,textarea{width:100%;padding:.6rem .7rem;border:1px solid var(--border);border-radius:9px;font-family:inherit;font-size:.95rem;background:#fff;color:#3d322a;}
  textarea{resize:vertical;min-height:2.4rem;}
  .row-check{display:flex;align-items:center;gap:.5rem;margin-top:1.5rem;}
  .row-check input{width:auto;}
  .row-check label{margin:0;text-transform:none;letter-spacing:0;font-size:.9rem;color:#3d322a;font-weight:500;}
  .actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem;align-items:center;}
  .btn{font-family:inherit;font-size:.85rem;font-weight:600;letter-spacing:.02em;border-radius:999px;padding:.6rem 1.35rem;cursor:pointer;border:1px solid var(--gold);background:var(--brown);color:#fff;}
  .btn.secondary{background:transparent;color:var(--brown);}
  .btn.ghost{background:transparent;color:var(--muted);border-color:var(--border);}
  .btn:hover{opacity:.92;}
  .formmsg{font-size:.82rem;color:var(--muted);}
  .formmsg.err{color:var(--red);}
  .formmsg.ok{color:var(--green);}
  /* Filters */
  .filters{display:flex;gap:.6rem;flex-wrap:wrap;align-items:end;margin-bottom:.9rem;}
  .filters .f{min-width:130px;}
  .filters label{margin-bottom:.2rem;}
  .spacer{flex:1;}
  /* Table */
  .tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 14px 34px -30px rgba(90,58,26,.35);}
  table{width:100%;border-collapse:collapse;min-width:760px;}
  th,td{text-align:left;padding:.65rem .8rem;font-size:.88rem;border-bottom:1px solid var(--border);vertical-align:top;}
  th{background:#f6f0e4;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:700;position:sticky;top:0;}
  td.amt{font-variant-numeric:tabular-nums;font-weight:600;color:var(--brown);white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  .cat-pill{display:inline-block;font-size:.72rem;padding:.15rem .55rem;border-radius:999px;background:#f2ead9;color:#6b5836;border:1px solid var(--border);white-space:nowrap;}
  .muted{color:var(--muted);font-size:.82rem;}
  .rowbtn{font-family:inherit;font-size:.74rem;border:1px solid var(--border);background:#fff;border-radius:7px;padding:.25rem .55rem;cursor:pointer;color:var(--brown);margin-right:.3rem;}
  .rowbtn.del{color:var(--red);border-color:#f0cfc7;background:#fdecea;}
  .rowbtn.rcpt{color:#185fa5;border-color:#b5d4f4;background:#eef4fb;}
  .badge-yes{color:var(--green);font-size:.8rem;}
  .badge-no{color:var(--muted);font-size:.8rem;}
  .empty{text-align:center;padding:2.5rem 1rem;color:var(--muted);}
  .status{text-align:center;font-size:.8rem;color:var(--muted);margin-top:.9rem;}
  .signout{text-align:center;margin-top:1.6rem;}
  /* Category breakdown */
  .breakdown{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.5rem;margin-top:.4rem;}
  .bd-item{display:flex;justify-content:space-between;padding:.5rem .7rem;background:#f7f1e6;border:1px solid var(--border);border-radius:9px;font-size:.85rem;}
  .bd-item .c{color:#6b5836;}
  .bd-item .v{font-weight:600;color:var(--brown);font-variant-numeric:tabular-nums;}
  /* Login gate */
  #gate{position:fixed;inset:0;background:var(--ivory);display:flex;align-items:center;justify-content:center;padding:1.2rem;z-index:50;}
  .gatecard{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2.2rem 1.8rem;max-width:380px;width:100%;text-align:center;box-shadow:0 24px 60px -34px rgba(90,58,26,.5);}
  .gatecard h2{font-family:Georgia,serif;color:var(--brown);font-size:1.5rem;margin-bottom:.3rem;}
  .gatecard p{color:var(--muted);font-size:.86rem;margin-bottom:1.2rem;line-height:1.5;}
  .gatecard input{margin-bottom:.7rem;text-align:center;}
  .gateerr{color:var(--red);font-size:.82rem;min-height:1.1rem;margin-bottom:.5rem;}
</style>
</head>
<body>
  <!-- Login gate -->
  <div id="gate">
    <div class="gatecard">
      <div class="eyebrow">Auric Movement</div>
      <h2>Business Expenses</h2>
      <p>Sign in with your owner account to view and manage expenses.</p>
      <input id="gate-email" type="email" placeholder="Email" autocomplete="username" autofocus>
      <input id="gate-pass" type="password" placeholder="Password" autocomplete="current-password">
      <div class="gateerr" id="gate-err"></div>
      <button class="btn" id="gate-btn" style="width:100%;">Sign in</button>
    </div>
  </div>

  <div class="wrap" id="app" style="display:none;">
    <header>
      <div class="eyebrow">Auric Movement LLC</div>
      <h1>Business <em>Expenses</em></h1>
    </header>

    <div class="stats" id="stats">
      <div class="stat"><div class="label">Total</div><div class="value" id="st-total">$0</div></div>
      <div class="stat"><div class="label">This Year</div><div class="value" id="st-year">$0</div></div>
      <div class="stat"><div class="label">This Month</div><div class="value" id="st-month">$0</div></div>
      <div class="stat"><div class="label">Deductible</div><div class="value" id="st-ded">$0</div></div>
    </div>

    <!-- Add / edit form -->
    <div class="panel">
      <h2 id="form-title">Add an expense</h2>
      <form id="exp-form">
        <div class="grid">
          <div><label>Date</label><input type="date" id="f-date"></div>
          <div><label>Amount ($)</label><input type="number" id="f-amount" step="0.01" min="0" inputmode="decimal" placeholder="0.00"></div>
          <div><label>Vendor</label><input type="text" id="f-vendor" placeholder="e.g. Alibaba, The Space"></div>
          <div>
            <label>Category</label>
            <select id="f-category"></select>
          </div>
          <div>
            <label>Payment method</label>
            <select id="f-method"></select>
          </div>
          <div><label>Purpose (business reason)</label><input type="text" id="f-purpose" placeholder="e.g. Studio rental for Mat & Chat"></div>
          <div style="grid-column:1/-1;"><label>Notes (optional)</label><textarea id="f-notes" placeholder="Anything else to remember"></textarea></div>
          <div style="grid-column:1/-1;"><label>Receipt (photo or PDF, optional)</label><input type="file" id="f-receipt" accept="image/*,application/pdf,.pdf"></div>
        </div>
        <div class="row-check">
          <input type="checkbox" id="f-deductible" checked>
          <label for="f-deductible">Tax-deductible business expense</label>
        </div>
        <div class="actions">
          <button type="submit" class="btn" id="f-submit">Add expense</button>
          <button type="button" class="btn ghost" id="f-cancel" style="display:none;">Cancel edit</button>
          <span class="formmsg" id="f-msg"></span>
        </div>
      </form>
    </div>

    <!-- Category breakdown -->
    <div class="panel">
      <h2>By category</h2>
      <div class="breakdown" id="breakdown"></div>
    </div>

    <!-- Filters + list -->
    <div class="filters">
      <div class="f"><label>Year</label><select id="flt-year"></select></div>
      <div class="f"><label>Category</label><select id="flt-cat"></select></div>
      <div class="spacer"></div>
      <button class="btn secondary" id="btn-csv">&#8681; Export CSV</button>
      <button class="btn ghost" id="btn-refresh">&#8635; Refresh</button>
    </div>

    <div class="tablewrap">
      <table>
        <thead><tr>
          <th>Date</th><th>Vendor</th><th>Category</th><th>Purpose</th>
          <th>Method</th><th style="text-align:right;">Amount</th><th>Ded.</th><th>Receipt</th><th></th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="status" id="status"></div>

    <div class="signout"><button class="btn ghost" id="signout-btn">Sign out</button></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (function(){
    var SB_URL = 'https://qvmiwyxerotkqpbuhpun.supabase.co';
    var SB_KEY = 'sb_publishable_PHihtZqr-zBTcppyHSwSjg_klBABTpJ';
    var sb = null;
    try { if (window.supabase && window.supabase.createClient) sb = window.supabase.createClient(SB_URL, SB_KEY); } catch(e){}

    var CATEGORIES = ['Venue / Studio Rental','Equipment (Reformers, Props)','Insurance',
      'Software & Fees','Marketing / Ads','Merch & Supplies','Legal & Registration',
      'Travel / Mileage','Contractors / Instructors','Meals','Other'];
    var METHODS = ['Card','Bank / ACH','Cash','PayPal / Venmo','Zelle','Other'];

    var gate=document.getElementById('gate'), app=document.getElementById('app');
    var rows=[];            // all expenses (owner sees all)
    var editingId=null;     // when editing an existing row

    // ---- auth ----
    function showApp(){ gate.style.display='none'; app.style.display='block'; init(); }
    function showGate(){ app.style.display='none'; gate.style.display='flex'; }
    function signIn(){
      var email=document.getElementById('gate-email').value.trim();
      var pass=document.getElementById('gate-pass').value;
      var err=document.getElementById('gate-err'); err.textContent='';
      if(!sb){ err.textContent='Could not connect. Refresh and try again.'; return; }
      if(!email||!pass){ err.textContent='Enter your email and password.'; return; }
      var btn=document.getElementById('gate-btn'); btn.disabled=true; btn.textContent='Signing in…';
      sb.auth.signInWithPassword({email:email,password:pass}).then(function(res){
        btn.disabled=false; btn.textContent='Sign in';
        if(res && res.error){ err.textContent='Wrong email or password.'; return; }
        showApp();
      }, function(){ btn.disabled=false; btn.textContent='Sign in'; err.textContent='Could not sign in. Try again.'; });
    }
    document.getElementById('gate-btn').addEventListener('click', signIn);
    document.getElementById('gate-pass').addEventListener('keydown', function(e){ if(e.key==='Enter') signIn(); });
    document.getElementById('gate-email').addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('gate-pass').focus(); });
    document.getElementById('signout-btn').addEventListener('click', function(){ if(sb) sb.auth.signOut().then(showGate, showGate); else showGate(); });
    if(sb){ sb.auth.getSession().then(function(res){ if(res && res.data && res.data.session) showApp(); }); }

    // ---- helpers ----
    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
    function money(n){ n=Number(n)||0; return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
    function fmtDate(d){ if(!d) return '<span class="muted">—</span>'; try{ var p=d.split('-'); return p[1]+'/'+p[2]+'/'+p[0].slice(2); }catch(e){ return esc(d); } }
    function fillSelect(el, arr, withAll){ el.innerHTML = (withAll?'<option value="">All</option>':'') + arr.map(function(c){ return '<option value="'+esc(c)+'">'+esc(c)+'</option>'; }).join(''); }

    fillSelect(document.getElementById('f-category'), CATEGORIES, false);
    fillSelect(document.getElementById('f-method'), METHODS, false);
    fillSelect(document.getElementById('flt-cat'), CATEGORIES, true);

    // ---- load ----
    function init(){
      fillSelect(document.getElementById('f-method'), METHODS, false);
      load();
    }
    function load(){
      var st=document.getElementById('status'); st.textContent='Loading…';
      if(!sb){ st.textContent='Could not connect.'; return; }
      sb.from('business_expenses').select('*').order('spent_on',{ascending:false,nullsFirst:false}).order('created_at',{ascending:false})
        .then(function(res){
          if(res && res.error){ st.textContent='Could not load expenses. Make sure the setup SQL has been run.'; return; }
          rows = res.data || [];
          buildYearFilter();
          render();
          st.textContent = rows.length + (rows.length===1?' expense':' expenses') + ' · updated '+new Date().toLocaleTimeString();
        }, function(){ st.textContent='Could not load expenses.'; });
    }

    function buildYearFilter(){
      var sel=document.getElementById('flt-year'); var prev=sel.value;
      var years={}; rows.forEach(function(r){ if(r.spent_on) years[r.spent_on.slice(0,4)]=1; });
      var list=Object.keys(years).sort().reverse();
      sel.innerHTML='<option value="">All years</option>'+list.map(function(y){return '<option value="'+y+'">'+y+'</option>';}).join('');
      if(prev) sel.value=prev;
    }

    function currentFilter(){
      return { year:document.getElementById('flt-year').value, cat:document.getElementById('flt-cat').value };
    }
    function filtered(){
      var f=currentFilter();
      return rows.filter(function(r){
        if(f.year && (!r.spent_on || r.spent_on.slice(0,4)!==f.year)) return false;
        if(f.cat && r.category!==f.cat) return false;
        return true;
      });
    }

    function render(){
      renderStats(); renderBreakdown(); renderTable();
    }

    function renderStats(){
      var now=new Date(), yr=String(now.getFullYear()), ym=yr+'-'+String(now.getMonth()+1).padStart(2,'0');
      var total=0, yearT=0, monthT=0, ded=0;
      rows.forEach(function(r){
        var a=Number(r.amount)||0; total+=a;
        if(r.deductible) ded+=a;
        if(r.spent_on){ if(r.spent_on.slice(0,4)===yr) yearT+=a; if(r.spent_on.slice(0,7)===ym) monthT+=a; }
      });
      document.getElementById('st-total').textContent=money(total);
      document.getElementById('st-year').textContent=money(yearT);
      document.getElementById('st-month').textContent=money(monthT);
      document.getElementById('st-ded').textContent=money(ded);
    }

    function renderBreakdown(){
      var f=filtered(), by={};
      f.forEach(function(r){ var c=r.category||'Uncategorized'; by[c]=(by[c]||0)+(Number(r.amount)||0); });
      var keys=Object.keys(by).sort(function(a,b){ return by[b]-by[a]; });
      var el=document.getElementById('breakdown');
      if(!keys.length){ el.innerHTML='<div class="muted">No expenses in this view.</div>'; return; }
      el.innerHTML=keys.map(function(c){ return '<div class="bd-item"><span class="c">'+esc(c)+'</span><span class="v">'+money(by[c])+'</span></div>'; }).join('');
    }

    function renderTable(){
      var f=filtered(), tb=document.getElementById('tbody');
      if(!f.length){ tb.innerHTML='<tr><td colspan="9" class="empty">No expenses yet. Add your first one above.</td></tr>'; return; }
      tb.innerHTML=f.map(function(r){
        var rcpt = r.receipt_path
          ? '<button class="rowbtn rcpt" onclick="expViewReceipt(\''+esc(r.id)+'\')">View</button>'
          : '<span class="muted">—</span>';
        return '<tr>'+
          '<td>'+fmtDate(r.spent_on)+'</td>'+
          '<td>'+esc(r.vendor||'')+'</td>'+
          '<td><span class="cat-pill">'+esc(r.category||'—')+'</span></td>'+
          '<td>'+esc(r.purpose||'')+(r.notes?'<br><span class="muted">'+esc(r.notes)+'</span>':'')+'</td>'+
          '<td class="muted">'+esc(r.payment_method||'')+'</td>'+
          '<td class="amt" style="text-align:right;">'+money(r.amount)+'</td>'+
          '<td>'+(r.deductible?'<span class="badge-yes">✓</span>':'<span class="badge-no">—</span>')+'</td>'+
          '<td>'+rcpt+'</td>'+
          '<td style="white-space:nowrap;text-align:right;">'+
            '<button class="rowbtn" onclick="expEdit(\''+esc(r.id)+'\')">Edit</button>'+
            '<button class="rowbtn del" onclick="expDelete(\''+esc(r.id)+'\')">Delete</button>'+
          '</td></tr>';
      }).join('');
    }

    document.getElementById('flt-year').addEventListener('change', render);
    document.getElementById('flt-cat').addEventListener('change', render);
    document.getElementById('btn-refresh').addEventListener('click', load);

    // ---- add / edit ----
    function resetForm(){
      editingId=null;
      document.getElementById('form-title').textContent='Add an expense';
      document.getElementById('f-submit').textContent='Add expense';
      document.getElementById('f-cancel').style.display='none';
      document.getElementById('exp-form').reset();
      document.getElementById('f-deductible').checked=true;
      document.getElementById('f-msg').textContent=''; document.getElementById('f-msg').className='formmsg';
    }
    document.getElementById('f-cancel').addEventListener('click', resetForm);

    window.expEdit=function(id){
      var r=rows.find(function(x){return String(x.id)===String(id);}); if(!r) return;
      editingId=id;
      document.getElementById('form-title').textContent='Edit expense';
      document.getElementById('f-submit').textContent='Save changes';
      document.getElementById('f-cancel').style.display='';
      document.getElementById('f-date').value=r.spent_on||'';
      document.getElementById('f-amount').value=r.amount!=null?r.amount:'';
      document.getElementById('f-vendor').value=r.vendor||'';
      document.getElementById('f-category').value=r.category||'Other';
      document.getElementById('f-method').value=r.payment_method||'';
      document.getElementById('f-purpose').value=r.purpose||'';
      document.getElementById('f-notes').value=r.notes||'';
      document.getElementById('f-deductible').checked=!!r.deductible;
      document.getElementById('f-receipt').value='';
      document.getElementById('f-msg').textContent = r.receipt_path ? 'A receipt is attached. Choose a new file only if you want to replace it.' : '';
      document.getElementById('f-msg').className='formmsg';
      window.scrollTo({top:0,behavior:'smooth'});
    };

    document.getElementById('exp-form').addEventListener('submit', function(e){
      e.preventDefault();
      var msg=document.getElementById('f-msg'); msg.className='formmsg'; msg.textContent='';
      var amount=parseFloat(document.getElementById('f-amount').value);
      if(isNaN(amount)||amount<0){ msg.className='formmsg err'; msg.textContent='Enter a valid amount.'; return; }
      var rec={
        spent_on: document.getElementById('f-date').value || null,
        amount: amount,
        vendor: document.getElementById('f-vendor').value.trim() || null,
        category: document.getElementById('f-category').value || null,
        payment_method: document.getElementById('f-method').value || null,
        purpose: document.getElementById('f-purpose').value.trim() || null,
        notes: document.getElementById('f-notes').value.trim() || null,
        deductible: document.getElementById('f-deductible').checked
      };
      var file=document.getElementById('f-receipt').files[0];
      var submit=document.getElementById('f-submit'); submit.disabled=true; submit.textContent='Saving…';

      function afterReceipt(receiptPath){
        if(receiptPath!==undefined) rec.receipt_path=receiptPath;
        var op = editingId
          ? sb.from('business_expenses').update(rec).eq('id', editingId)
          : sb.from('business_expenses').insert([rec]);
        op.then(function(res){
          submit.disabled=false; submit.textContent = editingId ? 'Save changes' : 'Add expense';
          if(res && res.error){ msg.className='formmsg err'; msg.textContent='Could not save: '+res.error.message; return; }
          var wasEdit=!!editingId;
          resetForm();
          msg.className='formmsg ok'; msg.textContent = wasEdit ? 'Saved.' : 'Expense added.';
          load();
        }, function(){ submit.disabled=false; submit.textContent=editingId?'Save changes':'Add expense'; msg.className='formmsg err'; msg.textContent='Could not save. Try again.'; });
      }

      if(file){
        var safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
        var path=(self.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2))+'_'+safe;
        sb.storage.from('receipts').upload(path, file, {upsert:false}).then(function(up){
          if(up && up.error){ submit.disabled=false; submit.textContent=editingId?'Save changes':'Add expense'; msg.className='formmsg err'; msg.textContent='Receipt upload failed: '+up.error.message; return; }
          afterReceipt(path);
        }, function(){ submit.disabled=false; submit.textContent=editingId?'Save changes':'Add expense'; msg.className='formmsg err'; msg.textContent='Receipt upload failed.'; });
      } else {
        afterReceipt(); // no receipt change
      }
    });

    window.expViewReceipt=function(id){
      var r=rows.find(function(x){return String(x.id)===String(id);}); if(!r||!r.receipt_path) return;
      sb.storage.from('receipts').createSignedUrl(r.receipt_path, 120).then(function(res){
        if(res && res.data && res.data.signedUrl){ window.open(res.data.signedUrl,'_blank'); }
        else{ alert('Could not open the receipt.'); }
      }, function(){ alert('Could not open the receipt.'); });
    };

    window.expDelete=function(id){
      var r=rows.find(function(x){return String(x.id)===String(id);}); if(!r) return;
      if(!confirm('Delete this expense'+(r.vendor?(' from '+r.vendor):'')+' ('+money(r.amount)+')? This cannot be undone.')) return;
      sb.from('business_expenses').delete().eq('id', id).then(function(res){
        if(res && res.error){ alert('Could not delete: '+res.error.message); return; }
        if(r.receipt_path){ try{ sb.storage.from('receipts').remove([r.receipt_path]); }catch(e){} }
        load();
      }, function(){ alert('Could not delete. Try again.'); });
    };

    // ---- CSV export (respects current filter) ----
    document.getElementById('btn-csv').addEventListener('click', function(){
      var f=filtered();
      if(!f.length){ alert('Nothing to export in this view.'); return; }
      function ce(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }
      var csv='Date,Vendor,Category,Purpose,Notes,Payment method,Amount,Deductible,Has receipt\n';
      f.forEach(function(r){
        csv+=[ce(r.spent_on||''),ce(r.vendor||''),ce(r.category||''),ce(r.purpose||''),ce(r.notes||''),
          ce(r.payment_method||''),ce(Number(r.amount||0).toFixed(2)),ce(r.deductible?'Yes':'No'),ce(r.receipt_path?'Yes':'No')].join(',')+'\n';
      });
      var total=f.reduce(function(s,r){return s+(Number(r.amount)||0);},0);
      csv+=['','','','','','"TOTAL"','"'+total.toFixed(2)+'"','',''].join(',')+'\n';
      var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
      var url=URL.createObjectURL(blob), a=document.createElement('a');
      a.href=url; a.download='auric-expenses.csv';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); },1000);
    });
  })();
  </script>
</body>
</html>
