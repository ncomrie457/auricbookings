<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Payment received — Riddim &amp; Kompa on the Reformer | Auric Movement</title>

  <!-- Clean success URL for Stripe (no query string of its own). Stripe may
       append ?session_id=… here; we ignore it and forward to the real
       confirmation screen, which reads ?paid=reformer&s=1pm. -->
  <meta http-equiv="refresh" content="0;url=/?paid=reformer&amp;s=1pm">
  <script>window.location.replace('/?paid=reformer&s=1pm');</script>

  <style>
    body {
      font-family: 'Cormorant Garamond', Georgia, serif;
      background: #f8f1e7;
      color: #5A3A1A;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-style: italic;
      text-align: center;
      padding: 2rem;
    }
    a { color: #b0432e; text-decoration: none; }
  </style>
</head>
<body>
  <p>Confirming your booking&hellip; <a href="/?paid=reformer&s=1pm">Continue</a></p>
</body>
</html>
